<!doctype html>
<html lang="{siteLanguage}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{pageTitle} &middot; {siteName}</title>
    <meta name="description" content="{pageDescription}">
    <link rel="icon" href="{freezed:resource(path: 'favicon.svg', context: 'static')}" type="image/svg+xml">
    <link rel="icon" href="{freezed:resource(path: 'favicon-32.png', context: 'static')}" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="{freezed:resource(path: 'apple-touch-icon.png', context: 'static')}" sizes="512x512">
    <link rel="stylesheet" href="{freezed:resource(path: 'assets/css/main.css', context: 'theme')}">
    <f:render section="head" optional="1" />
</head>
<body>

<f:render partial="site-header" arguments="{_all}" />

<main>
    <f:render section="content" />
</main>

<f:render partial="site-footer" arguments="{_all}" />

<script src="{freezed:resource(path: 'assets/js/main.js', context: 'theme')}" defer></script>
</body>
</html>
